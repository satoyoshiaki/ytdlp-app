apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'jp.techlab.ytdlapp.muse'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.techlab.ytdlapp.muse'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        multiDexEnabled true
        ndk {
            // 予備 Redmi（arm64）向けに絞って APK を軽くする
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 配布はサイドロード前提のため debug 鍵で署名する（先行クローンと同じ運用）
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
    }
}

dependencies {
    // yt-dlp + CPython + ffmpeg を AAR に同梱するライブラリ（Seal 等で実績のある方式）
    // JitPack の 0.15.0 以降のビルドが全て Error のため、公式ソース(0.18.1)を
    // kaguya-home で自前ビルドした AAR を libs/ に置いて参照する。
    implementation files('libs/common-0.18.1.aar')
    implementation files('libs/library-0.18.1.aar')
    implementation files('libs/ffmpeg-0.18.1.aar')
    // AAR の推移的依存（files() では自動解決されないため手動で列挙）
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.11.1'
    implementation 'commons-io:commons-io:2.5'
    implementation 'org.apache.commons:commons-compress:1.12'
}
